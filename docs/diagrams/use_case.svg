<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="620" fill="#f8f9fc" rx="12"/>
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Use Case Diagram — Library Book Management System</text>

  <!-- System boundary -->
  <rect x="180" y="60" width="580" height="530" rx="10" fill="white" stroke="#3b5bdb" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="470" y="85" text-anchor="middle" font-size="13" fill="#3b5bdb" font-weight="bold">Library Management System</text>

  <!-- Actor: Admin/Staff (left) -->
  <!-- stick figure -->
  <circle cx="80" cy="200" r="20" fill="none" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="80" y1="220" x2="80" y2="300" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="80" y1="240" x2="50" y2="270" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="80" y1="240" x2="110" y2="270" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="80" y1="300" x2="55" y2="340" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="80" y1="300" x2="105" y2="340" stroke="#1a1a2e" stroke-width="2"/>
  <text x="80" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Admin / Staff</text>

  <!-- Actor: Member (right) -->
  <circle cx="820" cy="340" r="20" fill="none" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="820" y1="360" x2="820" y2="440" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="820" y1="380" x2="790" y2="410" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="820" y1="380" x2="850" y2="410" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="820" y1="440" x2="795" y2="480" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="820" y1="440" x2="845" y2="480" stroke="#1a1a2e" stroke-width="2"/>
  <text x="820" y="498" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Member</text>

  <!-- Use case ellipses — column 1 (book mgmt) -->
  <ellipse cx="320" cy="130" rx="110" ry="26" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="320" y="135" text-anchor="middle" font-size="12" fill="#1a1a2e">Login to System</text>

  <ellipse cx="320" cy="200" rx="110" ry="26" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="320" y="205" text-anchor="middle" font-size="12" fill="#1a1a2e">Manage Books</text>

  <ellipse cx="320" cy="270" rx="110" ry="26" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="320" y="275" text-anchor="middle" font-size="12" fill="#1a1a2e">Manage Members</text>

  <ellipse cx="320" cy="340" rx="110" ry="26" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="320" y="345" text-anchor="middle" font-size="12" fill="#1a1a2e">Issue Book</text>

  <ellipse cx="320" cy="410" rx="110" ry="26" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="320" y="415" text-anchor="middle" font-size="12" fill="#1a1a2e">Return Book</text>

  <ellipse cx="320" cy="480" rx="110" ry="26" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="320" y="485" text-anchor="middle" font-size="12" fill="#1a1a2e">View Reports</text>

  <ellipse cx="320" cy="550" rx="110" ry="26" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="320" y="555" text-anchor="middle" font-size="12" fill="#1a1a2e">Manage Fines</text>

  <!-- Use case ellipses — column 2 (sub use cases) -->
  <ellipse cx="590" cy="200" rx="110" ry="26" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="590" y="196" text-anchor="middle" font-size="11" fill="#1a1a2e">Add / Update /</text>
  <text x="590" y="210" text-anchor="middle" font-size="11" fill="#1a1a2e">Remove / Search Book</text>

  <ellipse cx="590" cy="270" rx="110" ry="26" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="590" y="266" text-anchor="middle" font-size="11" fill="#1a1a2e">Register / Update /</text>
  <text x="590" y="280" text-anchor="middle" font-size="11" fill="#1a1a2e">Remove Member</text>

  <ellipse cx="590" cy="340" rx="110" ry="26" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="590" y="336" text-anchor="middle" font-size="11" fill="#1a1a2e">Check Availability</text>
  <text x="590" y="350" text-anchor="middle" font-size="11" fill="#1a1a2e">&amp; Borrow Limit</text>

  <ellipse cx="590" cy="410" rx="110" ry="26" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="590" y="406" text-anchor="middle" font-size="11" fill="#1a1a2e">Detect Overdue</text>
  <text x="590" y="420" text-anchor="middle" font-size="11" fill="#1a1a2e">&amp; Calculate Fine</text>

  <ellipse cx="590" cy="480" rx="110" ry="26" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="590" y="476" text-anchor="middle" font-size="11" fill="#1a1a2e">Reserve Book /</text>
  <text x="590" y="490" text-anchor="middle" font-size="11" fill="#1a1a2e">Cancel Reservation</text>

  <ellipse cx="590" cy="550" rx="110" ry="26" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="590" y="546" text-anchor="middle" font-size="11" fill="#1a1a2e">Transaction History</text>
  <text x="590" y="560" text-anchor="middle" font-size="11" fill="#1a1a2e">&amp; Summary Stats</text>

  <!-- Lines: Admin → use cases -->
  <line x1="140" y1="200" x2="210" y2="135" stroke="#555" stroke-width="1.2"/>
  <line x1="140" y1="220" x2="210" y2="205" stroke="#555" stroke-width="1.2"/>
  <line x1="140" y1="240" x2="210" y2="270" stroke="#555" stroke-width="1.2"/>
  <line x1="140" y1="255" x2="210" y2="340" stroke="#555" stroke-width="1.2"/>
  <line x1="140" y1="265" x2="210" y2="410" stroke="#555" stroke-width="1.2"/>
  <line x1="140" y1="275" x2="210" y2="480" stroke="#555" stroke-width="1.2"/>
  <line x1="140" y1="285" x2="210" y2="550" stroke="#555" stroke-width="1.2"/>

  <!-- Lines: include -->
  <line x1="430" y1="200" x2="480" y2="200" stroke="#3b5bdb" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="453" y="193" text-anchor="middle" font-size="10" fill="#3b5bdb">«include»</text>

  <line x1="430" y1="270" x2="480" y2="270" stroke="#3b5bdb" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="453" y="263" text-anchor="middle" font-size="10" fill="#3b5bdb">«include»</text>

  <line x1="430" y1="340" x2="480" y2="340" stroke="#3b5bdb" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="453" y="333" text-anchor="middle" font-size="10" fill="#3b5bdb">«include»</text>

  <line x1="430" y1="410" x2="480" y2="410" stroke="#3b5bdb" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="453" y="403" text-anchor="middle" font-size="10" fill="#3b5bdb">«include»</text>

  <line x1="430" y1="480" x2="480" y2="480" stroke="#3b5bdb" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="453" y="473" text-anchor="middle" font-size="10" fill="#3b5bdb">«extend»</text>

  <line x1="430" y1="480" x2="480" y2="550" stroke="#3b5bdb" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="458" y="523" text-anchor="middle" font-size="10" fill="#3b5bdb">«include»</text>

  <!-- Member → Reserve -->
  <line x1="760" y1="355" x2="700" y2="482" stroke="#555" stroke-width="1.2"/>
</svg>
