<svg viewBox="0 0 860 580" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="11">
  <rect width="860" height="580" fill="#f8f9fc" rx="12"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">Sequence Diagram — Issue Book</text>

  <!-- Lifeline headers -->
  <rect x="30"  y="50" width="110" height="34" rx="6" fill="#3b5bdb"/>
  <rect x="195" y="50" width="110" height="34" rx="6" fill="#2e7d32"/>
  <rect x="360" y="50" width="110" height="34" rx="6" fill="#2e7d32"/>
  <rect x="525" y="50" width="110" height="34" rx="6" fill="#2e7d32"/>
  <rect x="690" y="50" width="110" height="34" rx="6" fill="#e65100"/>

  <text x="85"  y="72" text-anchor="middle" fill="white" font-weight="bold">:ConsoleMenu</text>
  <text x="250" y="72" text-anchor="middle" fill="white" font-weight="bold">:BorrowService</text>
  <text x="415" y="72" text-anchor="middle" fill="white" font-weight="bold">:MemberService</text>
  <text x="580" y="72" text-anchor="middle" fill="white" font-weight="bold">:BookService</text>
  <text x="745" y="72" text-anchor="middle" fill="white" font-weight="bold">:FileStorage</text>

  <!-- Lifelines -->
  <line x1="85"  y1="84" x2="85"  y2="560" stroke="#3b5bdb" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="250" y1="84" x2="250" y2="560" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="415" y1="84" x2="415" y2="560" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="580" y1="84" x2="580" y2="560" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="745" y1="84" x2="745" y2="560" stroke="#e65100" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Activation boxes -->
  <rect x="78"  y="120" width="14" height="400" fill="#3b5bdb" opacity="0.3"/>
  <rect x="243" y="140" width="14" height="320" fill="#2e7d32" opacity="0.3"/>
  <rect x="408" y="160" width="14" height="60"  fill="#2e7d32" opacity="0.3"/>
  <rect x="573" y="230" width="14" height="60"  fill="#2e7d32" opacity="0.3"/>
  <rect x="738" y="430" width="14" height="40"  fill="#e65100" opacity="0.3"/>

  <!-- Messages -->
  <!-- 1 -->
  <line x1="92" y1="130" x2="243" y2="130" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="160" y="125" text-anchor="middle" font-size="10" fill="#1a1a2e">1: issueBook(memberId, bookId)</text>

  <!-- 2 -->
  <line x1="257" y1="165" x2="408" y2="165" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="160" text-anchor="middle" font-size="10" fill="#1a1a2e">2: getMemberById(memberId)</text>

  <!-- 2 return -->
  <line x1="408" y1="195" x2="257" y2="195" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="330" y="190" text-anchor="middle" font-size="10" fill="#555">member object</text>

  <!-- 3 alt: member null -->
  <rect x="92" y="208" width="680" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="100" y="222" font-size="10" fill="#e65100" font-weight="bold">alt</text>
  <text x="170" y="222" font-size="10" fill="#555">[member == null]  →  print error, return false</text>

  <!-- 4 -->
  <line x1="257" y1="260" x2="573" y2="260" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="410" y="255" text-anchor="middle" font-size="10" fill="#1a1a2e">3: getBookById(bookId)</text>

  <!-- 4 return -->
  <line x1="573" y1="285" x2="257" y2="285" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="410" y="280" text-anchor="middle" font-size="10" fill="#555">book object</text>

  <!-- 5 alt: not available -->
  <rect x="92" y="298" width="680" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="100" y="312" font-size="10" fill="#e65100" font-weight="bold">alt</text>
  <text x="170" y="312" font-size="10" fill="#555">[!book.isAvailable()]  →  check reservation → print error / allow if reserved for this member</text>

  <!-- 6 -->
  <line x1="257" y1="358" x2="257" y2="358" stroke="#1a1a2e" stroke-width="1"/>
  <text x="270" y="355" font-size="10" fill="#1a1a2e">[borrowLimit check: size ≥ 3 → print error, return false]</text>

  <!-- 7 -->
  <line x1="257" y1="385" x2="573" y2="385" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="410" y="380" text-anchor="middle" font-size="10" fill="#1a1a2e">4: markAsIssued(bookId)</text>

  <!-- 8 -->
  <line x1="257" y1="410" x2="415" y2="410" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="405" text-anchor="middle" font-size="10" fill="#1a1a2e">5: member.borrowBook(bookId)</text>

  <!-- 9 -->
  <line x1="257" y1="435" x2="257" y2="435"/>
  <text x="270" y="432" font-size="10" fill="#1a1a2e">6: create Transaction(BORROW), add to log</text>

  <!-- 10 persist -->
  <line x1="257" y1="455" x2="738" y2="455" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <text x="490" y="450" text-anchor="middle" font-size="10" fill="#e65100">7: persist() → saveTransactions(log)</text>

  <!-- return -->
  <line x1="738" y1="480" x2="257" y2="480" stroke="#555" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="490" y="475" text-anchor="middle" font-size="10" fill="#555">saved</text>

  <!-- final return -->
  <line x1="243" y1="510" x2="92" y2="510" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="165" y="505" text-anchor="middle" font-size="10" fill="#555">8: return true + print due date</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a1a2e"/>
    </marker>
  </defs>
</svg>
