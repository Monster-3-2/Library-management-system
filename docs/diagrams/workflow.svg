<svg viewBox="0 0 860 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="11">
  <rect width="860" height="720" fill="#f8f9fc" rx="12"/>
  <text x="430" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">Process Flow — Library Book Management System</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c62828"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2e7d32"/></marker>
  </defs>

  <!-- START -->
  <ellipse cx="430" cy="60" rx="60" ry="24" fill="#1a1a2e"/>
  <text x="430" y="65" text-anchor="middle" fill="white" font-weight="bold">START</text>
  <line x1="430" y1="84" x2="430" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Login -->
  <rect x="300" y="110" width="260" height="40" rx="8" fill="#3b5bdb"/>
  <text x="430" y="135" text-anchor="middle" fill="white" font-weight="bold">Admin Login</text>
  <line x1="430" y1="150" x2="430" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Login valid? -->
  <polygon points="430,175 530,205 430,235 330,205" fill="white" stroke="#3b5bdb" stroke-width="2"/>
  <text x="430" y="209" text-anchor="middle" fill="#3b5bdb" font-weight="bold">Valid?</text>
  <!-- No path -->
  <line x1="530" y1="205" x2="640" y2="205" stroke="#c62828" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="582" y="198" text-anchor="middle" fill="#c62828" font-size="10">No (≤3 tries)</text>
  <rect x="640" y="188" width="110" height="34" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="695" y="209" text-anchor="middle" fill="#c62828" font-size="10">Show Error / Lock</text>
  <!-- Yes path -->
  <line x1="430" y1="235" x2="430" y2="260" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="442" y="252" font-size="10" fill="#2e7d32">Yes</text>

  <!-- Main Menu -->
  <rect x="290" y="260" width="280" height="40" rx="8" fill="#2e7d32"/>
  <text x="430" y="285" text-anchor="middle" fill="white" font-weight="bold">Main Menu (6 options)</text>
  <line x1="430" y1="300" x2="430" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Decision: which option -->
  <polygon points="430,325 560,360 430,395 300,360" fill="white" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="364" text-anchor="middle" fill="#2e7d32" font-weight="bold">Option?</text>

  <!-- Branch 1: Book Mgmt -->
  <line x1="300" y1="360" x2="80" y2="360" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="188" y="354" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="20" y="375" width="120" height="34" rx="6" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="80" y="395" text-anchor="middle" fill="#3b5bdb" font-size="10" font-weight="bold">Book Mgmt</text>
  <text x="80" y="425" text-anchor="middle" font-size="9" fill="#555">Add/Update/Remove</text>
  <text x="80" y="438" text-anchor="middle" font-size="9" fill="#555">Search / List</text>

  <!-- Branch 2: Member Mgmt -->
  <line x1="320" y1="395" x2="200" y2="440" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="255" y="425" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="140" y="455" width="120" height="34" rx="6" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="200" y="475" text-anchor="middle" fill="#3b5bdb" font-size="10" font-weight="bold">Member Mgmt</text>
  <text x="200" y="505" text-anchor="middle" font-size="9" fill="#555">Register/Update</text>
  <text x="200" y="518" text-anchor="middle" font-size="9" fill="#555">Validate &amp; Save</text>

  <!-- Branch 3: Borrow/Return -->
  <line x1="430" y1="395" x2="430" y2="455" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="442" y="430" font-size="9" fill="#333">3</text>
  <rect x="360" y="455" width="140" height="34" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="430" y="475" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="bold">Borrow / Return</text>
  <!-- Sub: issue checks -->
  <text x="430" y="505" text-anchor="middle" font-size="9" fill="#555">Check: available?</text>
  <text x="430" y="518" text-anchor="middle" font-size="9" fill="#555">limit? reserved?</text>
  <text x="430" y="531" text-anchor="middle" font-size="9" fill="#555">Set due date / Detect overdue</text>

  <!-- Branch 4: Reservation -->
  <line x1="540" y1="395" x2="610" y2="455" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="582" y="425" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="555" y="455" width="120" height="34" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="615" y="475" text-anchor="middle" fill="#e65100" font-size="10" font-weight="bold">Reservation</text>
  <text x="615" y="505" text-anchor="middle" font-size="9" fill="#555">Reserve / Cancel</text>
  <text x="615" y="518" text-anchor="middle" font-size="9" fill="#555">Notify on return</text>

  <!-- Branch 5: Fine -->
  <line x1="555" y1="360" x2="730" y2="360" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="640" y="354" font-size="9" fill="#333">5</text>
  <rect x="700" y="375" width="120" height="34" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="760" y="395" text-anchor="middle" fill="#c62828" font-size="10" font-weight="bold">Fine Calculator</text>
  <text x="760" y="425" text-anchor="middle" font-size="9" fill="#555">Rs. 2/day overdue</text>
  <text x="760" y="438" text-anchor="middle" font-size="9" fill="#555">Per-member summary</text>

  <!-- Branch 6: Reports -->
  <line x1="430" y1="395" x2="430" y2="555" stroke="none"/>
  <line x1="300" y1="395" x2="250" y2="555" stroke="#333" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="267" y="487" font-size="9" fill="#333">6</text>
  <rect x="190" y="555" width="120" height="34" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="250" y="575" text-anchor="middle" fill="#6a1b9a" font-size="10" font-weight="bold">Reports</text>
  <text x="250" y="605" text-anchor="middle" font-size="9" fill="#555">History / Overdue</text>
  <text x="250" y="618" text-anchor="middle" font-size="9" fill="#555">Summary stats</text>

  <!-- Persist arrow from Borrow -->
  <line x1="430" y1="489" x2="430" y2="545" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#a)"/>
  <rect x="350" y="545" width="160" height="30" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.2"/>
  <text x="430" y="564" text-anchor="middle" fill="#e65100" font-size="10">💾 Auto-persist to data/</text>

  <!-- Back to menu arrows -->
  <line x1="80" y1="409" x2="80" y2="640" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="80" y1="640" x2="430" y2="640" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="430" y1="640" x2="430" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="250" y="655" text-anchor="middle" font-size="9" fill="#888">← back to main menu after each action</text>

  <!-- EXIT -->
  <line x1="695" y1="205" x2="750" y2="205" stroke="none"/>
  <text x="695" y="243" text-anchor="middle" font-size="9" fill="#c62828">3 failures → Exit</text>
  <line x1="695" y1="222" x2="695" y2="248" stroke="#c62828" stroke-width="1.2" marker-end="url(#b)"/>
  <ellipse cx="695" cy="262" rx="44" ry="20" fill="#c62828"/>
  <text x="695" y="267" text-anchor="middle" fill="white" font-weight="bold" font-size="11">EXIT</text>

  <!-- Option 0: Logout -->
  <text x="430" y="682" text-anchor="middle" font-size="10" fill="#555">Option 0: Logout → session cleared → EXIT</text>
</svg>
